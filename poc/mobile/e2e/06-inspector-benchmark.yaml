# Inspector and the on-device benchmark (design §5 budgets / §14 P0 exit gate).
appId: com.twentydeka.ironpal
---
- runFlow: 00-launch.yaml
# The inspector is the last card in a scroll view; assertVisible only sees what is on screen.
- scrollUntilVisible:
    element:
        id: "inspector"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "inspector-benchmark"
- extendedWaitUntil:
    visible:
        id: "inspector-bench-result"
    timeout: 30000
# The result renders at the very bottom of the card: its bounds end flush with the content edge,
# and a plain-string assertVisible demands 100% visibility, so a partially clipped node fails
# even though its text is correct. Scroll it fully into view first.
- scrollUntilVisible:
    element:
        id: "inspector-bench-result"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
# The budgets come from design §5.1 and are shown beside the measurement, so a regression reads
# as a number next to the bar it broke.
- assertVisible: ".*budget 15.*"
- assertVisible: ".*budget 150.*"
- assertVisible: ".*budget 60.*"
