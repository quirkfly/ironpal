# AFTER ACTION — the queue and the Reel (studio design §7.8–§7.9).
# Fixture: split-squat-8reps. After one clean Debrief save the Reel shows the session with its
# set; a fully tagged fixture yields no untagged region; export is offered.
appId: com.twentydeka.ironpal
---
- runFlow: 00-launch.yaml
- tapOn:
    id: "campaign-start-session"
- extendedWaitUntil:
    visible:
        id: "campaign-calibrate"
    timeout: 20000
- tapOn:
    id: "campaign-calibrate"
- tapOn:
    id: "level-bulgarian-split-squat"
- scrollUntilVisible:
    element:
        id: "mission-arm"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "mission-arm"
- extendedWaitUntil:
    notVisible: "WAITING FOR MOTION"
    timeout: 45000
- extendedWaitUntil:
    visible:
        id: "hud-reps"
        text: "[0-9]{2}"
    timeout: 90000
- tapOn:
    id: "hud-end-set"
- extendedWaitUntil:
    visible:
        id: "labeling-screen"
    timeout: 30000
- tapOn:
    id: "labeling-exercise-bulgarian-split-squat"
- scrollUntilVisible:
    element:
        id: "labeling-save"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "labeling-save"
- scrollUntilVisible:
    element:
        id: "labeling-outcome"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
        id: "labeling-back"
    direction: UP
    timeout: 20000
- tapOn:
    id: "labeling-back"
- extendedWaitUntil:
    visible:
        id: "campaign-screen"
    timeout: 15000

# The After Action tile opens the queue; the queue opens the Reel.
- scrollUntilVisible:
    element:
        id: "campaign-after-action"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "campaign-after-action"
- extendedWaitUntil:
    visible:
        id: "queue-screen"
    timeout: 15000
- assertVisible:
    id: "queue-count"
- tapOn:
    id: "queue-open-reel"
- extendedWaitUntil:
    visible:
        id: "reel-screen"
    timeout: 20000
- assertVisible:
    id: "reel-strip"
# One set in the session; no untagged region on a fully tagged fixture; export is offered.
- extendedWaitUntil:
    visible:
        id: "reel-set-set_[0-9]+"
    timeout: 20000
- scrollUntilVisible:
    element:
        id: "reel-regions-empty"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "reel-export"
# Tapping the set opens the Studio on it (a stored set: relabel path).
- scrollUntilVisible:
    element:
        id: "reel-set-set_[0-9]+"
    direction: UP
    timeout: 20000
- tapOn:
    id: "reel-set-set_[0-9]+"
- extendedWaitUntil:
    visible:
        id: "studio-screen"
    timeout: 30000
- assertVisible:
    id: "studio-save"
    text: ".*SAVE CHANGES.*"
- tapOn:
    id: "studio-back"
- extendedWaitUntil:
    visible:
        id: "reel-screen"
    timeout: 15000
