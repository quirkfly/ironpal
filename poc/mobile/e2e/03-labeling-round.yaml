# THE LABELING UI — the core of the harness.
# Fixture: split-squat-8reps (verified against the engine in FixtureReplayTest).
# Exercises: trace, rep marks, mark toggling, exercise picker, weight, explanations, save,
# and the level transition the save causes.
appId: com.twentydeka.ironpal
---
- runFlow: 00-launch.yaml
- tapOn:
    id: "campaign-start-session"
- extendedWaitUntil:
    visible:
        id: "campaign-calibrate"
    timeout: 20000
# Calibrate rather than skip: a clean set requires the rig gate, which requires calibration.
- tapOn:
    id: "campaign-calibrate"
- tapOn:
    id: "level-bulgarian-split-squat"
- scrollUntilVisible:
    element:
        id: "mission-arm"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "mission-arm"

# Let the fixture play far enough to accumulate reps, then close the set.
- extendedWaitUntil:
    notVisible: "WAITING FOR MOTION"
    timeout: 45000
# Wait for REPS, not for animation. `waitForAnimationToEnd` returns as soon as the UI settles,
# which can be after one or two reps — and the motion quality gate needs at least three, so the
# set would be saved as "not counted" and the flow would fail for a reason that is entirely its
# own doing. Waiting for a two-digit count is unambiguous and well clear of the gate.
- extendedWaitUntil:
    visible:
        id: "hud-reps"
        text: "[0-9]{2}"
    timeout: 90000
- tapOn:
    id: "hud-end-set"

# --- the labeling round opens ---
- extendedWaitUntil:
    visible:
        id: "labeling-screen"
    timeout: 30000
- assertVisible:
    id: "labeling-title"

# 1. Reps: the trace renders with the detector's marks, and the ±1 gate is shown.
- assertVisible:
    id: "rep-trace"
- assertVisible:
    id: "rep-trace-caption"
- assertVisible:
    id: "labeling-detected-reps"
- assertVisible:
    id: "labeling-rep-gate"
- assertVisible: ".*within ±1.*"
- assertVisible:
    id: "labeling-reps-explain"

# Marks are individually toggleable — tap the first one off, the caption must follow.
- assertVisible:
    id: "rep-mark-1"
- tapOn:
    id: "rep-mark-1"
- assertVisible:
    id: "rep-trace-caption"
# ...and back on, so the flow leaves the count as the detector found it.
- tapOn:
    id: "rep-mark-1"

# 2. Exercise: the model's proposal is explained, and the picker is a real choice.
- assertVisible:
    id: "labeling-exercise-explain"
- tapOn:
    id: "labeling-exercise-bulgarian-split-squat"
# "why?" only exists when the matcher had runner-up candidates to show. On a first-ever set the
# index is empty, so there are none and the control is correctly absent — hence optional.
- tapOn:
    id: "labeling-why"
    optional: true

# 3. Weight: type one, then prove "couldn't see it" is a first-class answer.
- scrollUntilVisible:
    element:
        id: "labeling-weight-explain"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "labeling-weight-input"
- inputText: "24"
- hideKeyboard
- tapOn:
    id: "labeling-weight-unreadable"
- tapOn:
    id: "labeling-weight-input"
- inputText: "24"
- hideKeyboard

# 4. Save — and the model must report what it learned.
- scrollUntilVisible:
    element:
        id: "labeling-save"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "labeling-save"
- scrollUntilVisible:
    element:
        id: "labeling-outcome"
    direction: DOWN
    timeout: 30000
- assertVisible: ".*Clean set.*"
- assertVisible: ".*XP.*"

# Back on the map the level has left `locked` and the inspector knows about it.
- scrollUntilVisible:
    element:
        id: "labeling-back"
    direction: UP
    timeout: 20000
- tapOn:
    id: "labeling-back"
- extendedWaitUntil:
    visible:
        id: "campaign-screen"
    timeout: 15000
# The inspector is the last card on the map, below the level grid.
- scrollUntilVisible:
    element:
        id: "inspector-level-bulgarian-split-squat"
    direction: DOWN
    timeout: 20000
- assertVisible: ".*recon.*"
