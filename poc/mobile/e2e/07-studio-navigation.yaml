# AFTER ACTION — frame navigation (studio design §7.2–§7.4, §17).
# Fixture: split-squat-8reps IMU + studio-clip.mp4 (20 s, 30 fps, burned-in frame counter).
# The Studio attaches the fixture clip when the e2e marker is present, so the flow can step
# frames without a camera. Assertions read the Studio's own frame HUD, never the video pixels.
appId: com.twentydeka.ironpal
---
- runFlow: 00-launch.yaml
- tapOn:
    id: "campaign-start-session"
- extendedWaitUntil:
    visible:
        id: "campaign-calibrate"
    timeout: 20000
- tapOn:
    id: "campaign-calibrate"
- tapOn:
    id: "level-bulgarian-split-squat"
- scrollUntilVisible:
    element:
        id: "mission-arm"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "mission-arm"
- extendedWaitUntil:
    notVisible: "WAITING FOR MOTION"
    timeout: 45000
- extendedWaitUntil:
    visible:
        id: "hud-reps"
        text: "[0-9]{2}"
    timeout: 90000
- tapOn:
    id: "hud-end-set"
- extendedWaitUntil:
    visible:
        id: "labeling-screen"
    timeout: 30000

# Open the round in After Action from the reps card.
- assertVisible:
    id: "labeling-open-studio-reps"
- tapOn:
    id: "labeling-open-studio-reps"
- extendedWaitUntil:
    visible:
        id: "studio-screen"
    timeout: 30000
- assertVisible:
    id: "studio-frame"
- assertVisible:
    id: "studio-sync"

# Frame stepping is by PTS table: forward, back, and the wheel.
- extendedWaitUntil:
    visible:
        id: "studio-frame"
        text: ".*· f [0-9]+ ·.*"
    timeout: 20000
- tapOn:
    id: "studio-step-frame-next"
- tapOn:
    id: "studio-step-frame-next"
- assertVisible:
    id: "studio-frame"
    text: ".*· f 3 ·.*"
- tapOn:
    id: "studio-step-frame-prev"
- assertVisible:
    id: "studio-frame"
    text: ".*· f 2 ·.*"
# The jog wheel: a swipe across it is a burst of detents; the frame must move.
- swipe:
    from:
        id: "studio-jog"
    direction: RIGHT
    duration: 400
- assertNotVisible:
    id: "studio-frame"
    text: ".*· f 2 ·.*"
# Rep stepping lands on the first mark.
- tapOn:
    id: "studio-step-rep-next"
- assertVisible:
    id: "rep-mark-1"
- assertVisible:
    id: "studio-marks-caption"
# Modes and the gesture sheet exist.
- tapOn:
    id: "studio-mode-marks"
- assertVisible:
    id: "studio-mark-add"
- tapOn:
    id: "studio-mode-review"
- longPressOn:
    id: "studio-viewer"
- assertVisible:
    id: "studio-gesture-sheet"
- tapOn:
    point: "50%,10%"
# Back returns to the Debrief with the round still open.
- tapOn:
    id: "studio-back"
- extendedWaitUntil:
    visible:
        id: "labeling-screen"
    timeout: 15000
